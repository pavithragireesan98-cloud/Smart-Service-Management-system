<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akshaya Secure Pay | Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --secondary: #06b6d4;
            --bg: #030712;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8f9fa;
            --text-dim: #94a3b8;
            --glass: rgba(15, 23, 42, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(6, 182, 212, 0.15) 0%, transparent 40%);
            padding: 20px;
        }

        .gateway-container {
            width: 100%;
            max-width: 480px;
            perspective: 1000px;
        }

        .gateway-card {
            background: var(--glass);
            backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.5);
            animation: cardEntrance 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(40px) rotateX(-10deg);
            }

            to {
                opacity: 1;
                transform: translateY(0) rotateX(0);
            }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 18px;
            color: #fff;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .amount-tag {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
        }

        .order-info {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 32px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-label {
            color: var(--text-dim);
            font-size: 13px;
        }

        .info-value {
            color: #fff;
            font-size: 13px;
            font-weight: 600;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px;
            border-radius: 14px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
            color: var(--text-dim);
        }

        .tab.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .input-group {
            position: relative;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            padding: 14px 16px;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: 0.3s;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-pay {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 16px;
            color: #fff;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-pay:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.4);
        }

        .security-footer {
            margin-top: 32px;
            font-size: 11px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <div class="gateway-container">
        <div class="gateway-card">
            <div class="header">
                <div class="brand">
                    <div class="brand-icon">🛡️</div>
                    Akshaya Secure
                </div>
                <div class="amount-tag">₹{{ data[0] }}</div>
            </div>

            <div class="order-info">
                <div class="info-row">
                    <span class="info-label">Service</span>
                    <span class="info-value">{{ data[1] }}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Customer</span>
                    <span class="info-value">{{ data[2] }}</span>
                </div>
            </div>

            <div class="tabs">
                <div class="tab active" id="tab-card" onclick="switchMode('card')">💳 Card</div>
                <div class="tab" id="tab-upi" onclick="switchMode('upi')">📱 UPI / GPay</div>
            </div>

            <form id="pay-form" action="/citizen/payment/process/{{ token_id }}" method="POST">
                <div id="card-form">
                    <div class="form-group">
                        <label>Card Number</label>
                        <input type="text" placeholder="XXXX XXXX XXXX XXXX" maxlength="19"
                            oninput="this.value = this.value.replace(/\W/gi, '').replace(/(.{4})/g, '$1 ').trim()">
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div class="form-group">
                            <label>Expiry Date</label>
                            <input type="text" placeholder="MM/YY" maxlength="5">
                        </div>
                        <div class="form-group">
                            <label>CVV</label>
                            <input type="password" placeholder="***" maxlength="3">
                        </div>
                    </div>
                </div>

                <div id="upi-form" style="display: none;">
                    <div class="form-group">
                        <label>UPI ID</label>
                        <input type="text" placeholder="username@okaxis">
                    </div>
                </div>

                <button type="submit" class="btn-pay">
                    <span>🔒</span>
                    Pay ₹{{ data[0] }} Securely
                </button>
            </form>

            <div class="security-footer">
                <span>✓ PCI DSS Compliant</span>
                <span>✓ 256-bit SSL</span>
                <span>✓ Verified by Visa</span>
            </div>
        </div>
    </div>

    <script>
        function switchMode(mode) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if (mode === 'card') {
                document.getElementById('tab-card').classList.add('active');
                document.getElementById('card-form').style.display = 'block';
                document.getElementById('upi-form').style.display = 'none';
            } else {
                document.getElementById('tab-upi').classList.add('active');
                document.getElementById('card-form').style.display = 'none';
                document.getElementById('upi-form').style.display = 'block';
            }
        }
    </script>
</body>

</html>

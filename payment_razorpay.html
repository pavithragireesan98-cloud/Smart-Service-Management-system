<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment | Akshaya Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --secondary: #06b6d4;
            --bg: #030712;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8f9fa;
            --text-dim: #94a3b8;
            --glass: rgba(15, 23, 42, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(circle at 100% 0%, rgba(99, 102, 241, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 0% 100%, rgba(6, 182, 212, 0.1) 0%, transparent 40%);
            padding: 20px;
        }

        .gateway-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .loader-ring {
            display: inline-block;
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
        }

        .loader-ring:after {
            content: " ";
            display: block;
            width: 64px;
            height: 64px;
            margin: 8px;
            border-radius: 50%;
            border: 6px solid var(--primary);
            border-color: var(--primary) transparent var(--primary) transparent;
            animation: loader-ring 1.2s linear infinite;
        }

        @keyframes loader-ring {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        h2 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #fff;
        }

        p {
            color: var(--text-dim);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn-pay-trigger {
            width: 100%;
            padding: 18px;
            background: #fff;
            color: #030712;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-pay-trigger:hover {
            transform: scale(1.02);
            background: var(--primary-light);
            color: #fff;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 16px;
            margin-top: 32px;
            font-size: 13px;
            color: var(--text-dim);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Hidden form */
        #payment-form {
            display: none;
        }
    </style>
</head>

<body>
    <div class="gateway-card">
        <div class="loader-ring"></div>
        <h2>Ready for Checkout</h2>
        <p>A secure connection to the payment gateway has been established for <strong>{{ service_name }}</strong>.</p>

        <button id="rzp-button" class="btn-pay-trigger">
            <span>💳</span>
            Pay ₹{{ amount_paise / 100 }} Now
        </button>

        <div class="info-box">
            🛡️ Your payment info is encrypted and never stored on our servers.
        </div>

        <form id="payment-form" action="/citizen/payment_callback/{{ token_id }}" method="POST">
            <input type="hidden" name="razorpay_payment_id" id="razorpay_payment_id">
            <input type="hidden" name="razorpay_order_id" id="razorpay_order_id">
            <input type="hidden" name="razorpay_signature" id="razorpay_signature">
        </form>
    </div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        const options = {
            "key": "{{ razorpay_key_id }}",
            "amount": "{{ amount_paise }}",
            "currency": "INR",
            "name": "Akshaya Hub",
            "description": "Payment for {{ service_name }}",
            "image": "https://akshaya.kerala.gov.in/portal/images/logo.png",
            "order_id": "{{ razorpay_order_id }}",
            "handler": function (response) {
                document.getElementById('razorpay_payment_id').value = response.razorpay_payment_id;
                document.getElementById('razorpay_order_id').value = response.razorpay_order_id;
                document.getElementById('razorpay_signature').value = response.razorpay_signature;
                document.getElementById('payment-form').submit();
            },
            "prefill": {
                "name": "{{ user_name }}",
                "contact": "{{ mobile_number }}"
            },
            "theme": {
                "color": "#6366f1"
            },
            "modal": {
                "ondismiss": function () {
                    // Optional: redirect back or show message
                }
            }
        };
        const rzp = new Razorpay(options);

        document.getElementById('rzp-button').onclick = function (e) {
            rzp.open();
            e.preventDefault();
        }

        // We can still try to auto-open, but the button is there as a reliable fallback
        // which mobile browsers will respect since it's a user gesture.
        window.onload = function () {
            setTimeout(() => {
                try {
                    // rzp.open(); // Removing auto-open to favor user-gesture specifically for mobile
                } catch (e) { }
            }, 1000);
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manager Registration – Akshaya Centre</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f1a; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;}
        .register-container { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 16px; width: 100%; max-width: 500px; backdrop-filter: blur(10px); box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        h2 { text-align: center; color: #ce93d8; margin-bottom: 25px; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 13px; color: #bbb; }
        .form-control { width: 100%; padding: 12px 14px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-size: 15px; transition: 0.3s; }
        .form-control:focus { outline: none; border-color: #ce93d8; box-shadow: 0 0 8px rgba(206, 147, 216, 0.3); }
        
        select.form-control option { background: #0f0f1a; color: #fff; }
        
        .submit-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #ce93d8, #ab47bc); color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.3s; margin-top: 10px; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(206, 147, 216, 0.4); }
        
        .login-link { text-align: center; margin-top: 20px; font-size: 14px; color: #aaa; }
        .login-link a { color: #ce93d8; text-decoration: none; font-weight: bold; }
        .login-link a:hover { text-decoration: underline; }
        
        .success-msg { background: rgba(76, 175, 80, 0.2); color: #66bb6a; padding: 15px; border-radius: 8px; border: 1px solid rgba(76, 175, 80, 0.3); text-align: center; margin-bottom: 20px; }
        .error-msg { background: rgba(244, 67, 54, 0.15); border: 1px solid rgba(244, 67, 54, 0.5); color: #ff8a80; padding: 15px; border-radius: 8px; font-size: 14px; text-align: center; margin-bottom: 20px; }
        .section-title { font-size: 14px; color: #ce93d8; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; margin-bottom: 15px; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; }
        
        .password-container { position: relative; width: 100%; }
        .btn-show { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #ce93d8; font-size: 11px; font-weight: bold; cursor: pointer; z-index: 5; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="register-container">
        <h2>Register Akshaya Centre</h2>
        
        {% if success %}
            <div class="success-msg">
                Your registration has been submitted successfully! Please wait for Admin approval to login.
            </div>
            <div class="login-link">
                <a href="/">Return to Login</a>
            </div>
        {% else %}
            {% if error %}
                <div class="error-msg">⚠️ {{ error }}</div>
            {% endif %}

            <form method="POST" enctype="multipart/form-data">
                <div class="section-title" style="margin-top: 25px;">Manager Profile Details</div>
                <div class="form-group">
                    <label>Manager Name</label>
                    <input type="text" name="name" class="form-control" value="{{ form_data.get('name', '') if form_data else '' }}" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="example@gmail.com" value="{{ form_data.get('email', '') if form_data else '' }}" pattern="[a-zA-Z0-9._%+-]+@gmail\.com$" title="Only Gmail addresses ending with @gmail.com are allowed" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-container">
                            <input type="password" name="password" id="password" class="form-control" minlength="8" maxlength="8" pattern=".{8}" title="Exactly 8 characters" value="{{ form_data.get('password', '') if form_data else '' }}" required>
                            <button type="button" class="btn-show" onclick="togglePass('password', this)">Show</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <div class="password-container">
                            <input type="password" name="confirm_password" id="confirm_password" class="form-control" minlength="8" maxlength="8" pattern=".{8}" title="Exactly 8 characters" required>
                            <button type="button" class="btn-show" onclick="togglePass('confirm_password', this)">Show</button>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" name="Contact_number" id="Contact_number" class="form-control" value="{{ form_data.get('Contact_number', '') if form_data else '' }}" pattern="[0-9]{10}" minlength="10" maxlength="10" title="Please enter exactly 10 digits" required oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                </div>
                
                <div class="form-group">
                    <label>Address</label>
                    <textarea name="address" class="form-control" rows="3" required>{{ form_data.get('address', '') if form_data else '' }}</textarea>
                </div>
                
                <div class="form-group">
                    <label>Profile Picture</label>
                    <input type="file" name="profile_picture" class="form-control" accept="image/*" required>
                </div>
                
                <button type="submit" class="submit-btn">Submit Registration</button>
            </form>
            <div class="login-link">
                Already approved? <a href="/">Login here</a>
            </div>
        {% endif %}
    </div>

    <script>
        const form = document.querySelector('form');
        const pass = document.getElementById('password');
        const cpass = document.getElementById('confirm_password');
        const emailInput = document.querySelector('input[name="email"]');
        
        // Form validation
        window.addEventListener('DOMContentLoaded', () => {
            // Nothing to init
        });
        
        if (form && pass && cpass && emailInput) {
            form.addEventListener('submit', function(e) {
                if (pass.value !== cpass.value) {
                    e.preventDefault();
                    alert("Passwords do not match!");
                    return;
                }
                if (!emailInput.value.endsWith('@gmail.com')) {
                    e.preventDefault();
                    alert("Please enter a valid Gmail address ending with @gmail.com!");
                    return;
                }
            });
        }
        
        function togglePass(id, btn) {
            const el = document.getElementById(id);
            if (el.type === 'password') {
                el.type = 'text';
                btn.textContent = 'Hide';
            } else {
                el.type = 'password';
                btn.textContent = 'Show';
            }
        }
    </script>
</body>
</html>

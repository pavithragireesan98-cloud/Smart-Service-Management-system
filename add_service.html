<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add Service – Admin</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #4a148c, #7b1fa2);
            padding: 18px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #fff;
            font-size: 20px;
        }

        header a {
            color: #fff;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
        }

        .container {
            max-width: 560px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 36px;
        }

        h2 {
            font-size: 20px;
            color: #ce93d8;
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #ccc;
            margin-bottom: 6px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 18px;
            font-family: inherit;
        }

        select option {
            background: #1a1a2e;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #ce93d8;
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        .hint {
            font-size: 11px;
            color: #888;
            margin-top: -14px;
            margin-bottom: 18px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #7b1fa2, #ce93d8);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.88;
        }
    </style>
</head>

<body>
    <header>
        <h1>🏛 Admin – Akshaya Centre</h1>
        <a href="/admin">← Dashboard</a>
    </header>
    <div class="container">
        <div class="card">
            <h2>⚙️ Add New Service</h2>
            <form method="POST">
                <label>Service Name</label>
                <input type="text" name="service_name" placeholder="e.g. Income Certificate" required>

                <label>Service Fee (₹)</label>
                <input type="number" name="service_fee" placeholder="e.g. 50" required>

                <label>Description (Optional)</label>
                <textarea name="description" placeholder="Brief details about the service..."></textarea>

                <label>Document Description</label>
                <textarea name="document_description" placeholder="Details about documents needed..."></textarea>

                <label>Target Centre</label>
                <select name="centre_id" required>
                    <option value="" disabled selected>-- Select Centre --</option>
                    {% for c in centres %}
                    <option value="{{ c[0] }}">{{ c[1] }}</option>
                    {% endfor %}
                </select>

                <label>Required Documents</label>
                <textarea name="documents"
                    placeholder="Aadhaar Card, Proof of Address, Photo (comma-separated)"></textarea>
                <p class="hint">Documents will be saved as mandatory by default.</p>

                <button type="submit">Publish Service</button>
            </form>
        </div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Centre | Akshaya Automation</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow-x: hidden;
            padding: 2rem;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                padding: 1.5rem;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-section {
            display: flex;
            flex-direction: column;
        }

        .map-section {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        h2 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .hidden {
            display: none;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-muted);
        }

        input,
        select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }

        select option {
            background: #1e1b4b;
            color: var(--text-main);
        }

        button {
            width: 100%;
            padding: 0.9rem;
            margin-top: 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: var(--primary);
        }

        /* Micro-animations */
        .form-group:focus-within label {
            color: var(--primary);
        }

        .map-container {
            flex-grow: 1;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            height: 280px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .map-header {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- FORM SECTION -->
        <div class="form-section">
            <h2>Add New Centre</h2>
            <p class="subtitle">Register a new Akshaya Centre in Palakkad</p>

            {% if error %}
                <div class="error-msg" style="background: rgba(244, 67, 54, 0.15); border: 1px solid rgba(244, 67, 54, 0.5); color: #ff8a80; padding: 15px; border-radius: 8px; font-size: 14px; text-align: center; margin-bottom: 20px;">⚠️ {{ error }}</div>
            {% endif %}

            <form method="POST" id="centreForm">
                <div class="form-group">
                    <label for="Center_name">Centre Name</label>
                    <input type="text" id="Center_name" name="Center_name" placeholder="Enter centre name" required>
                </div>

                <div class="form-group hidden">
                    <label for="ward">Ward</label>
                    <select id="ward" name="ward"></select>
                </div>

                <div class="form-group">
                    <label for="building_no">Building No</label>
                    <input type="text" id="building_no" name="building_no" placeholder="Building No/Name" required>
                </div>

                <div class="form-group">
                    <label for="street_name">Street Name</label>
                    <input type="text" id="street_name" name="street_name" placeholder="Street Name" required>
                </div>

                <div class="form-group">
                    <label for="location_or_place">Location / Place</label>
                    <input type="text" id="location_or_place" name="location_or_place" placeholder="Location or Place"
                        required>
                </div>

                <div class="form-group">
                    <label for="district">District</label>
                    <input type="text" id="district" name="district" placeholder="District" required value="Palakkad">
                </div>

                <div class="form-group">
                    <label for="email_id">Email ID</label>
                    <input type="email" id="email_id" name="email_id" placeholder="centre@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="Contact_number">Contact Number</label>
                    <input type="tel" id="Contact_number" name="Contact_number"
                        placeholder="Enter 10-digit mobile number" required minlength="10" maxlength="10"
                        pattern="[0-9]{10}" title="Please enter exactly 10 digits" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                </div>

                <!-- Hidden latitude and longitude inputs updated via map click -->
                <input type="hidden" id="latitude" name="latitude" required>
                <input type="hidden" id="longitude" name="longitude" required>

                <!-- Hidden field for backend compatibility -->
                <input type="hidden" name="location" id="finalLocation">

                <button type="submit">Register Centre</button>
            </form>

            <a href="/admin" class="back-link">← Back to Dashboard</a>
        </div>

        <!-- MAP SECTION -->
        <div class="map-section">
            <div class="map-header">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
                Pattambi Location Map & Quick Pick
            </div>

            <!-- Dynamic Ward Directory -->
            <div id="quickPick"
                style="margin-bottom: 1.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; max-height: 250px; overflow-y: auto; padding-right: 0.5rem;">
                <!-- Populated via JS -->
            </div>

            <div class="map-container">
                <div id="leafletMap" style="width: 100%; height: 100%; z-index: 1;"></div>
            </div>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 1rem; text-align: center;">
                Click on the map to select the exact location. Existing Akshaya Centres are highlighted.
            </p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        const wardSelect = document.getElementById('ward');
        const finalLocation = document.getElementById('finalLocation');
        const centreNameInput = document.getElementById('Center_name');
        const form = document.getElementById('centreForm');

        const pattambiWards = [
            "1 - Valloor North", "2 - Valloor East", "3 - Second Mile", "4 - Kalappara",
            "5 - Kodalur Centre", "6 - Nediyamkunnu", "7 - Sankaramangalam", "8 - Thekkumuri",
            "9 - Chorakkunnu", "10 - College", "11 - Kizhake Angadi", "12 - Hidayath Nagar",
            "13 - Cheruliparambu", "14 - Kizhayur", "15 - Lovely", "16 - Kolorkunnu",
            "17 - Mele Pattambi", "18 - Umikkunnu", "19 - Nambram", "20 - Pattambi Town",
            "21 - Kaithali", "22 - Mele Pattambi North", "23 - Paruvakkadavu", "24 - Kozhikkunnu",
            "25 - Civil Station", "26 - Nethirimangalam", "27 - Thottungal City", "28 - Pallippadu",
            "29 - Vallur Centre"
        ];

        function autoFill(name, ward) {
            centreNameInput.value = name;
            wardSelect.value = ward;

            // Add a subtle highlight effect to the input
            centreNameInput.style.borderColor = 'var(--primary)';
            setTimeout(() => centreNameInput.style.borderColor = '', 1000);
            updateFinalLocation();
        }

        function populateWards() {
            wardSelect.innerHTML = '<option value="" disabled selected>Select ward</option>';
            const quickPick = document.getElementById('quickPick');
            quickPick.innerHTML = '';

            pattambiWards.forEach(ward => {
                // Populate Dropdown
                const option = document.createElement('option');
                option.value = ward;
                option.textContent = ward;
                wardSelect.appendChild(option);

                // Populate Quick Pick Cards
                const parts = ward.split(' - ');
                const wardNum = parts[0];
                const wardNameOnly = parts.length > 1 ? parts[1] : ward;

                const card = document.createElement('div');
                card.className = 'pick-item';
                card.style.cssText = 'background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.2); padding: 0.75rem; border-radius: 12px; cursor: pointer; transition: all 0.3s ease;';
                card.innerHTML = `
                    <div style="font-size: 0.85rem; font-weight: 600; color: #818cf8;">${wardNameOnly}</div>
                    <div style="font-size: 0.7rem; color: var(--text-muted);">Ward ${wardNum}</div>
                `;
                card.onclick = () => autoFill(`Akshaya Centre ${wardNameOnly}`, ward);

                card.onmouseenter = () => {
                    card.style.background = 'rgba(99, 102, 241, 0.2)';
                    card.style.borderColor = 'var(--primary)';
                };
                card.onmouseleave = () => {
                    card.style.background = 'rgba(99, 102, 241, 0.1)';
                    card.style.borderColor = 'rgba(99, 102, 241, 0.2)';
                };

                quickPick.appendChild(card);
            });
        }

        function updateFinalLocation() {
            if (wardSelect.value) {
                finalLocation.value = `Palakkad - Pattambi - ${wardSelect.value}`;
            } else {
                finalLocation.value = "Palakkad - Pattambi";
            }
        }

        wardSelect.addEventListener('change', function () {
            if (this.value) {
                // Extract part after " - " (e.g. "Pattambi Town" from "20 - Pattambi Town")
                const parts = this.value.split(' - ');
                const namePart = parts.length > 1 ? parts[1] : this.value;
                centreNameInput.value = `Akshaya Centre ${namePart}`;
                updateFinalLocation();
            }
        });

        form.addEventListener('submit', function (e) {
            updateFinalLocation();
        });

        // Initialize
        populateWards();
        updateFinalLocation();

        // Initialize Leaflet Map over Pattambi
        const map = L.map('leafletMap', { attributionControl: false }).setView([10.8130, 76.1927], 13);

        // Add custom attribution without Leaflet name
        L.control.attribution({ prefix: false }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap Pattambi'
        }).addTo(map);

        let marker;

        map.on('click', function (e) {
            const lat = e.latlng.lat.toFixed(6);
            const lng = e.latlng.lng.toFixed(6);
            document.getElementById('latitude').value = lat;
            document.getElementById('longitude').value = lng;

            if (marker) {
                marker.setLatLng(e.latlng);
            } else {
                marker = L.marker(e.latlng).addTo(map);
            }
        });

        // Highlight all 29 Akshaya Centres for each ward in Pattambi Municipality
        const pattambiAkshayaCentres = pattambiWards.map((ward, index) => {
            const parts = ward.split(' - ');
            const wardName = parts.length > 1 ? parts[1] : ward;

            // Distribute the 29 centres evenly around Pattambi using a spiral pattern
            const angle = index * 137.5 * (Math.PI / 180);
            const radius = 0.003 + (index * 0.0006); // scale the scattering

            const lat = 10.8130 + (radius * Math.cos(angle));
            const lng = 76.1927 + (radius * Math.sin(angle));

            return {
                name: `Akshaya Centre ${wardName}`,
                lat: lat.toFixed(6),
                lng: lng.toFixed(6)
            };
        });

        pattambiAkshayaCentres.forEach(centre => {
            const staticMarker = L.circleMarker([centre.lat, centre.lng], {
                color: '#f59e0b', // Amber/Gold color to distinguish
                fillColor: '#fbbf24',
                fillOpacity: 0.9,
                radius: 8,
                weight: 2
            }).addTo(map);
            staticMarker.bindPopup(`<strong style="color: #d97706;">${centre.name}</strong><br>Pattambi Municipality`);
        });

        // Load existing dynamic Akshaya Centres from database
        const existingCentres = {{ existing_centres | tojson | safe if existing_centres else '[]' }};

        existingCentres.forEach(centre => {
            if (!isNaN(centre.lat) && !isNaN(centre.lng)) {
                const cMarker = L.circleMarker([centre.lat, centre.lng], {
                    color: '#6366f1',
                    fillColor: '#818cf8',
                    fillOpacity: 0.8,
                    radius: 8,
                    weight: 2
                }).addTo(map);
                cMarker.bindPopup(`<strong>${centre.name}</strong>`);
            }
        });
    </script>
</body>

</html>

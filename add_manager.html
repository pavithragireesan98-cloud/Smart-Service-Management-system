<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Manager – Akshaya Centre</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; }
        header { background: linear-gradient(135deg, #4a148c, #7b1fa2); padding: 18px 32px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { color: #fff; font-size: 20px; }
        header a { color: #fff; text-decoration: none; font-size: 14px; background: rgba(255,255,255,0.1); padding: 6px 14px; border-radius: 20px; transition: 0.3s; }
        header a:hover { background: rgba(255,255,255,0.2); }
        .container { max-width: 450px; margin: 60px auto; padding: 30px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #ce93d8; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 13px; color: #aaa; }
        .form-control { width: 100%; padding: 12px 15px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-size: 15px; transition: 0.3s; }
        .form-control:focus { outline: none; border-color: #ce93d8; box-shadow: 0 0 8px rgba(206,147,216,0.3); }
        .submit-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #ce93d8, #ab47bc); color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; transition: transform 0.2s, box-shadow 0.2s; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(206,147,216,0.4); }
        
        .password-container { position: relative; }
        .btn-show { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #ce93d8; font-size: 11px; font-weight: bold; cursor: pointer; z-index: 5; text-transform: uppercase; }
    </style>
</head>
<body>
    <header>
        <h1>🏛 Admin - Add Manager</h1>
        <a href="/admin">Back to Dashboard</a>
    </header>
    <div class="container">
        <h2>Register New Manager</h2>
        {% if error %}
            <div class="error-msg" style="background: rgba(244, 67, 54, 0.15); border: 1px solid rgba(244, 67, 54, 0.5); color: #ff8a80; padding: 15px; border-radius: 8px; font-size: 14px; text-align: center; margin-bottom: 20px;">⚠️ {{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="form-group">
                <label>Manager Name</label>
                <input type="text" name="name" class="form-control" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label>Email ID</label>
                <input type="email" name="email" class="form-control" placeholder="manager@akshaya.in" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="password-container">
                    <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" minlength="8" maxlength="8" pattern=".{8}" title="Password must be exactly 8 characters" required>
                    <button type="button" class="btn-show" onclick="togglePass('password', this)">Show</button>
                </div>
            </div>
            <div class="form-group">
                <label>Assign to Centre</label>
                <select name="centre_id" class="form-control" required>
                    <option value="" disabled selected>Select an Akshaya Centre</option>
                    {% for c in centres %}
                    <option style="color: black;" value="{{ c[0] }}">{{ c[1] }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="submit-btn">Add Manager 🚀</button>
        </form>
    </div>
    </div>

    <script>
        function togglePass(id, btn) {
            const el = document.getElementById(id);
            if (el.type === 'password') {
                el.type = 'text';
                btn.textContent = 'Hide';
            } else {
                el.type = 'password';
                btn.textContent = 'Show';
            }
        }
    </script>
</body>
</html>
